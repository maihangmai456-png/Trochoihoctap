    // --- Web Audio Sound Manager ---
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = localStorage.getItem('cn10_muted') === 'true';
      }
      isMuted() { return this.muted; }
      toggleMute() {
        this.muted = !this.muted;
        localStorage.setItem('cn10_muted', String(this.muted));
        return !this.muted;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playCorrect() {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const t = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, t + i * 0.05);
            gain.gain.setValueAtTime(0.1, t + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t + i * 0.05);
            osc.stop(t + i * 0.05 + 0.2);
          });
        } catch(e) {}
      }
      playWrong() {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.linearRampToValueAtTime(140, t + 0.2);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.2);
        } catch(e) {}
      }
      playClick() {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch(e) {}
      }
    }

    // --- Main Application Component ---
    function App() {
      const [studentId, setStudentId] = useState(localStorage.getItem('cn10_id') || '');
      const [studentName, setStudentName] = useState(localStorage.getItem('cn10_name') || '');
      const [studentClass, setStudentClass] = useState(localStorage.getItem('cn10_class') || '10C05');
      const [difficulty, setDifficulty] = useState('easy');
      const [screen, setScreen] = useState('lobby'); // lobby, match, categorize, timeline, scenario, review
      const [gameData, setGameData] = useState(null);
      const [score, setScore] = useState(0);
      const [timeSec, setTimeSec] = useState(60);
      const [isMuted, setIsMuted] = useState(sound.isMuted());
      const [showProfileModal, setShowProfileModal] = useState(!studentName);
      const [wrongItems, setWrongItems] = useState(JSON.parse(localStorage.getItem('cn10_wrongs') || '[]'));
      const [lastResult, setLastResult] = useState(null);
      const [syncMsg, setSyncMsg] = useState('');

      const saveStudent = (id, name, cls) => {
        setStudentId(id);
        setStudentName(name);
        setStudentClass(cls);
        localStorage.setItem('cn10_id', id);
        localStorage.setItem('cn10_name', name);
        localStorage.setItem('cn10_class', cls);
        setShowProfileModal(false);
      };

      const recordWrong = (item) => {
        const updated = [...wrongItems, item];
        setWrongItems(updated);
        localStorage.setItem('cn10_wrongs', JSON.stringify(updated));
      };

      const sendToSheet = async (res) => {
        setSyncMsg('Đang gửi kết quả đến Google Sheets giáo viên...');
        try {
          const payload = {
            sheetId: SHEET_TARGET_ID,
            spreadsheetId: SHEET_TARGET_ID,
            timestamp: new Date().toLocaleString('vi-VN'),
            thoiGian: new Date().toLocaleString('vi-VN'),
            studentId: studentId || '',
            maHocSinh: studentId || '',
            studentName: studentName || 'Học sinh',
            hoVaTen: studentName || 'Học sinh',
            hoTen: studentName || 'Học sinh',
            name: studentName || 'Học sinh',
            studentClass: studentClass || '10C05',
            lop: studentClass || '10C05',
            className: studentClass || '10C05',
            lessonName: res.lessonName,
            baiHoc: res.lessonName,
            modeName: res.modeName,
            cheDo: res.modeName,
            difficulty: difficulty === 'hard' ? 'Khó' : 'Dễ',
            mucDo: difficulty === 'hard' ? 'Khó' : 'Dễ',
            score: res.score,
            diem: res.score,
            diemSo: res.score,
            maxScore: res.maxScore,
            diemToiDa: res.maxScore,
            percentage: Math.round((res.score / Math.max(1, res.maxScore)) * 100) + '%',
            tiLeDung: Math.round((res.score / Math.max(1, res.maxScore)) * 100) + '%',
            correctCount: res.correct,
            soCauDung: res.correct,
            totalCount: res.total,
            tongSoCau: res.total,
            timeSpentSeconds: res.time,
            thoiGianGiay: res.time,
            thoiGianLamBai: `${Math.floor(res.time / 60)}p ${res.time % 60}s`,
            wrongQuestionsSummary: res.wrongs.map(w => `[${w.topic}] ${w.prompt} -> Chọn: ${w.ans}, Đúng: ${w.cor}`).join(' | '),
            cauSai: res.wrongs.map(w => `[${w.topic}] ${w.prompt} -> Chọn: ${w.ans}, Đúng: ${w.cor}`).join(' | ')
          };

          await fetch(GOOGLE_APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setSyncMsg('Đã ghi nhận và gửi thành công về Google Sheets của giáo viên!');
        } catch(e) {
          setSyncMsg('Đã lưu trên máy. Không thể kết nối máy chủ Google Sheets.');
        }
      };

      // --- Matching Game Sub-Component ---
      function MatchingView({ pairs, lessonTitle, modeTitle }) {
        const [leftList, setLeftList] = useState([]);
        const [rightList, setRightList] = useState([]);
        const [selLeft, setSelLeft] = useState(null);
        const [selRight, setSelRight] = useState(null);
        const [matched, setMatched] = useState([]);
        const [curScore, setCurScore] = useState(0);
        const [timer, setTimer] = useState(difficulty === 'hard' ? 40 : 80);
        const [exp, setExp] = useState(null);
        const startRef = useRef(Date.now());

        useEffect(() => {
          const count = difficulty === 'hard' ? 6 : 4;
          const chosen = [...pairs].sort(() => 0.5 - Math.random()).slice(0, count);
          setLeftList([...chosen].sort(() => 0.5 - Math.random()));
          setRightList([...chosen].sort(() => 0.5 - Math.random()));
        }, [pairs]);

        useEffect(() => {
          const id = setInterval(() => {
            setTimer(t => t > 0 ? t - 1 : 0);
          }, 1000);
          return () => clearInterval(id);
        }, []);

        const checkMatch = (lId, rId) => {
          const lItem = leftList.find(x => x.id === lId);
          const rItem = rightList.find(x => x.id === rId);
          if (lId === rId) {
            sound.playCorrect();
            const pts = difficulty === 'hard' ? 200 : 100;
            const newScore = curScore + pts;
            setCurScore(newScore);
            const newMatched = [...matched, lId];
            setMatched(newMatched);
            setExp(lItem.exp);
            setSelLeft(null);
            setSelRight(null);
            if (newMatched.length === leftList.length) {
              if (window.confetti) window.confetti({ particleCount: 50, spread: 60 });
              setTimeout(() => {
                const res = {
                  lessonName: lessonTitle,
                  modeName: modeTitle,
                  score: newScore,
                  maxScore: leftList.length * pts,
                  correct: leftList.length,
                  total: leftList.length,
                  time: Math.round((Date.now() - startRef.current) / 1000),
                  wrongs: []
                };
                setLastResult(res);
                sendToSheet(res);
                setScreen('result');
              }, 1200);
            }
          } else {
            sound.playWrong();
            recordWrong({
              topic: lessonTitle,
              prompt: `Ghép: ${lItem.left}`,
              ans: rItem.right,
              cor: lItem.right,
              exp: lItem.exp
            });
            setTimeout(() => {
              setSelLeft(null);
              setSelRight(null);
            }, 600);
          }
        };

        return (
          <div className="max-w-4xl mx-auto space-y-4">
            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between">
              <button onClick={() => setScreen('lobby')} className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">← Về trang chủ</button>
              <div className="text-center font-bold text-slate-800 text-sm">{modeTitle}</div>
              <div className="flex gap-3 text-xs font-mono font-bold">
                <span className="text-amber-600 bg-amber-50 px-2.5 py-1 rounded-lg border border-amber-200">Điểm: {curScore}</span>
                <span className="text-sky-700 bg-sky-50 px-2.5 py-1 rounded-lg border border-sky-200">Thời gian: {timer}s</span>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="space-y-2.5">
                <div className="text-xs font-bold text-indigo-700 uppercase tracking-wider px-1">Cột A: Đặc Điểm / Hình Ảnh</div>
                {leftList.map(item => {
                  const isDone = matched.includes(item.id);
                  const isSel = selLeft === item.id;
                  return (
                    <button
                      key={item.id}
                      disabled={isDone}
                      onClick={() => {
                        sound.playClick();
                        setSelLeft(item.id);
                        if (selRight) checkMatch(item.id, selRight);
                      }}
                      className={`w-full p-3.5 text-left rounded-xl border text-sm font-semibold transition-all ${
                        isDone ? 'bg-emerald-50 border-emerald-300 text-emerald-900 opacity-90' :
                        isSel ? 'bg-indigo-50 border-indigo-500 ring-2 ring-indigo-400 text-indigo-950 shadow-md scale-[1.01]' :
                        'bg-white hover:bg-slate-50 border-slate-200 text-slate-800 shadow-2xs'
                      }`}
                    >
                      {item.left}
                    </button>
                  );
                })}
              </div>

              <div className="space-y-2.5">
                <div className="text-xs font-bold text-sky-700 uppercase tracking-wider px-1">Cột B: Tên Công Nghệ / Ứng Dụng</div>
                {rightList.map(item => {
                  const isDone = matched.includes(item.id);
                  const isSel = selRight === item.id;
                  return (
                    <button
                      key={item.id}
                      disabled={isDone}
                      onClick={() => {
                        sound.playClick();
                        setSelRight(item.id);
                        if (selLeft) checkMatch(selLeft, item.id);
                      }}
                      className={`w-full p-3.5 text-left rounded-xl border text-sm font-semibold transition-all ${
                        isDone ? 'bg-emerald-50 border-emerald-300 text-emerald-900 opacity-90' :
                        isSel ? 'bg-sky-50 border-sky-500 ring-2 ring-sky-400 text-sky-950 shadow-md scale-[1.01]' :
                        'bg-white hover:bg-slate-50 border-slate-200 text-slate-800 shadow-2xs'
                      }`}
                    >
                      {item.right}
                    </button>
                  );
                })}
              </div>
            </div>

            {exp && (
              <div className="p-3.5 rounded-xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-950 font-medium">
                <strong>Giải thích SGK: </strong> {exp}
              </div>
            )}
          </div>
        );
      }

      // --- Scenario Quiz Sub-Component ---
      function ScenarioView({ list, lessonTitle, modeTitle }) {
        const [idx, setIdx] = useState(0);
        const [ans, setAns] = useState(null);
        const [scScore, setScScore] = useState(0);
        const [wrongs, setWrongs] = useState([]);
        const startRef = useRef(Date.now());
        const currentQ = list[idx];

        const choose = (optIdx) => {
          if (ans !== null) return;
          setAns(optIdx);
          const isCor = optIdx === currentQ.correct;
          if (isCor) {
            sound.playCorrect();
            setScScore(s => s + (difficulty === 'hard' ? 200 : 100));
          } else {
            sound.playWrong();
            const w = {
              topic: currentQ.topic,
              prompt: currentQ.prompt,
              ans: currentQ.options[optIdx],
              cor: currentQ.options[currentQ.correct],
              exp: currentQ.exp
            };
            setWrongs(prev => [...prev, w]);
            recordWrong(w);
          }
        };

        const next = () => {
          sound.playClick();
          setAns(null);
          if (idx + 1 < list.length) {
            setIdx(i => i + 1);
          } else {
            const finalScore = scScore;
            const res = {
              lessonName: lessonTitle,
              modeName: modeTitle,
              score: finalScore,
              maxScore: list.length * (difficulty === 'hard' ? 200 : 100),
              correct: list.length - wrongs.length,
              total: list.length,
              time: Math.round((Date.now() - startRef.current) / 1000),
              wrongs
            };
            setLastResult(res);
            sendToSheet(res);
            setScreen('result');
          }
        };

        return (
          <div className="max-w-2xl mx-auto space-y-4">
            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between">
              <button onClick={() => setScreen('lobby')} className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">← Về trang chủ</button>
              <span className="font-bold text-slate-800 text-sm">Câu {idx + 1}/{list.length}</span>
              <span className="text-amber-600 font-mono font-bold text-xs bg-amber-50 px-2.5 py-1 rounded-lg border border-amber-200">Điểm: {scScore}</span>
            </div>

            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
              <span className="text-[11px] font-bold uppercase text-sky-700 bg-sky-50 px-2 py-0.5 rounded border border-sky-200 inline-block mb-2">Chủ đề: {currentQ.topic}</span>
              <h3 className="text-base font-bold text-slate-900 leading-relaxed">{currentQ.prompt}</h3>
            </div>

            <div className="space-y-2.5">
              {currentQ.options.map((opt, i) => {
                let style = 'bg-white hover:bg-slate-50 border-slate-200 text-slate-800';
                if (ans !== null) {
                  if (i === currentQ.correct) style = 'bg-emerald-50 border-emerald-400 text-emerald-950 font-bold ring-2 ring-emerald-400/30';
                  else if (i === ans) style = 'bg-rose-50 border-rose-400 text-rose-800 line-through';
                  else style = 'bg-slate-50 border-slate-200 text-slate-400 opacity-50';
                }
                return (
                  <button
                    key={i}
                    disabled={ans !== null}
                    onClick={() => choose(i)}
                    className={`w-full p-4 rounded-xl border text-left text-sm font-semibold transition-all flex items-center justify-between ${style}`}
                  >
                    <span>{String.fromCharCode(65 + i)}. {opt}</span>
                  </button>
                );
              })}
            </div>

            {ans !== null && (
              <div className="p-4 rounded-xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-950 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="leading-relaxed"><strong>Giải thích SGK: </strong>{currentQ.exp}</div>
                <button onClick={next} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shrink-0">
                  {idx + 1 < list.length ? 'Câu tiếp theo →' : 'Xem kết quả'}
                </button>
              </div>
            )}
          </div>
        );
      }

      // --- Result Screen ---
      function ResultView() {
        if (!lastResult) return null;
        return (
          <div className="max-w-md mx-auto bg-white border border-slate-200 rounded-3xl p-6 shadow-xl text-center space-y-4 my-8">
            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-xs">🏆</div>
            <h2 className="text-2xl font-extrabold text-slate-900 font-heading">Hoàn Thành Bài Thi!</h2>
            <p className="text-xs text-slate-500 font-medium">{lastResult.lessonName} • {lastResult.modeName}</p>

            <div className="grid grid-cols-3 gap-2 py-2">
              <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                <span className="text-[10px] text-slate-400 block font-semibold">Điểm số</span>
                <span className="text-lg font-bold text-amber-600 font-mono">{lastResult.score}</span>
              </div>
              <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                <span className="text-[10px] text-slate-400 block font-semibold">Đúng</span>
                <span className="text-lg font-bold text-emerald-600 font-mono">{lastResult.correct}/{lastResult.total}</span>
              </div>
              <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                <span className="text-[10px] text-slate-400 block font-semibold">Thời gian</span>
                <span className="text-lg font-bold text-sky-600 font-mono">{lastResult.time}s</span>
              </div>
            </div>

            <div className="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-200 text-left">
              <strong className="block text-slate-800 mb-0.5">Báo cáo giáo viên ({studentName} - {studentClass}):</strong>
              {syncMsg}
            </div>

            <div className="flex gap-2 pt-2">
              <button onClick={() => setScreen('lobby')} className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-md">
                Về Trang Chủ Chọn Bài
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="bg-white/90 backdrop-blur-md border-b border-slate-200/90 px-4 py-2.5 sticky top-0 z-30 shadow-xs">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => setScreen('lobby')}>
                <div className="w-9 h-9 bg-gradient-to-tr from-indigo-600 to-sky-500 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-xs">CN</div>
                <div>
                  <h1 className="text-base font-extrabold text-slate-900 leading-tight">CÔNG NGHỆ 10</h1>
                  <p className="text-[10px] text-slate-500 font-semibold">Đấu Trường Trí Tuệ • KNTT</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowProfileModal(true)}
                  className="px-3 py-1.5 rounded-xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-900 font-bold truncate max-w-[200px]"
                >
                  👤 {studentId ? `${studentId} • ` : ''}{studentName || 'Nhập tên'} ({studentClass})
                </button>
                <button
                  onClick={() => setIsMuted(sound.toggleMute())}
                  className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 text-xs font-bold"
                >
                  {isMuted ? '🔇' : '🔊'}
                </button>
              </div>
            </div>
          </header>

          {/* Main Area */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6">
            {screen === 'lobby' && (
              <div className="space-y-6">
                {/* Hero Banner */}
                <div className="bg-gradient-to-br from-indigo-600 via-indigo-700 to-sky-600 rounded-3xl p-6 text-white shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <div className="space-y-1">
                    <span className="text-[10px] font-bold uppercase tracking-wider bg-white/20 px-2.5 py-0.5 rounded-full">Sách Giáo Khoa Kết Nối Tri Thức</span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold font-heading">Trò Chơi Học Tập Công Nghệ 10</h2>
                    <p className="text-xs sm:text-sm text-indigo-100">Bản tải về mở trực tiếp không cần mạng. Điểm số tự động gửi về Google Sheets giáo viên!</p>
                  </div>
                  <div className="flex gap-2 bg-white/15 p-2 rounded-2xl border border-white/25">
                    <button
                      onClick={() => setDifficulty('easy')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold ${difficulty === 'easy' ? 'bg-emerald-500 text-white shadow-xs' : 'text-indigo-100'}`}
                    >
                      🌱 Dễ (Gợi ý)
                    </button>
                    <button
                      onClick={() => setDifficulty('hard')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold ${difficulty === 'hard' ? 'bg-amber-500 text-white shadow-xs' : 'text-indigo-100'}`}
                    >
                      🔥 Khó (x2 Điểm)
                    </button>
                  </div>
                </div>

                {/* 3 Lessons Grid */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  {/* Bài 3 */}
                  <div className="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm space-y-4">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-200">Bài 3 (SGK tr. 14)</span>
                    </div>
                    <h3 className="text-lg font-bold text-slate-900 font-heading">Công Nghệ Phổ Biến</h3>
                    <p className="text-xs text-slate-500">Luyện kim, đúc, cắt gọt tiện phay, cán kéo, hàn, thuỷ điện, đèn LED, động cơ điện.</p>
                    <div className="space-y-2">
                      <button
                        onClick={() => { setGameData({ pairs: lesson3ImagePairs, lessonTitle: 'Bài 3: Công Nghệ Phổ Biến', modeTitle: 'Ghép Hình Ảnh – Tên Công Nghệ' }); setScreen('match'); }}
                        className="w-full p-2.5 text-left rounded-xl bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 text-xs font-bold text-slate-800"
                      >
                        🎮 1. Ghép Hình Ảnh – Tên Công Nghệ
                      </button>
                      <button
                        onClick={() => { setGameData({ pairs: lesson3FeaturePairs, lessonTitle: 'Bài 3: Công Nghệ Phổ Biến', modeTitle: 'Ghép Đặc Điểm – Ứng Dụng' }); setScreen('match'); }}
                        className="w-full p-2.5 text-left rounded-xl bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 text-xs font-bold text-slate-800"
                      >
                        🧩 2. Ghép Đặc Điểm – Ứng Dụng
                      </button>
                      <button
                        onClick={() => { setGameData({ list: lesson3Scenarios, lessonTitle: 'Bài 3: Công Nghệ Phổ Biến', modeTitle: 'Đoán Công Nghệ Qua Tình Huống' }); setScreen('scenario'); }}
                        className="w-full p-2.5 text-left rounded-xl bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 text-xs font-bold text-slate-800"
                      >
                        💡 3. Đoán Công Nghệ Qua Tình Huống
                      </button>
                    </div>
                  </div>

                  {/* Bài 4 */}
                  <div className="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm space-y-4">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-sky-700 bg-sky-50 px-2.5 py-0.5 rounded-full border border-sky-200">Bài 4 (SGK tr. 23)</span>
                    </div>
                    <h3 className="text-lg font-bold text-slate-900 font-heading">Một Số Công Nghệ Mới</h3>
                    <p className="text-xs text-slate-500">Nano (1-100nm), CAD/CAM/CNC, In 3D đắp lớp, năng lượng tái tạo, AI, IoT, Robot thông minh.</p>
                    <div className="space-y-2">
                      <button
                        onClick={() => { setGameData({ pairs: lesson4IdentifyPairs, lessonTitle: 'Bài 4: Một Số Công Nghệ Mới', modeTitle: 'Nhận Diện Công Nghệ Mới' }); setScreen('match'); }}
                        className="w-full p-2.5 text-left rounded-xl bg-slate-50 hover:bg-sky-50 border border-slate-200 hover:border-sky-300 text-xs font-bold text-slate-800"
                      >
                        🔍 1. Nhận Diện Công Nghệ Mới
                      </button>
                      <button
                        onClick={() => { setGameData({ pairs: lesson4Categorize.map((c, i) => ({ id: String(i), left: c.text, right: c.cat, exp: c.exp })), lessonTitle: 'Bài 4: Một Số Công Nghệ Mới', modeTitle: 'Phân Loại Ứng Dụng' }); setScreen('match'); }}
                        className="w-full p-2.5 text-left rounded-xl bg-slate-50 hover:bg-sky-50 border border-slate-200 hover:border-sky-300 text-xs font-bold text-slate-800"
                      >
                        📂 2. Phân Loại Ứng Dụng
                      </button>
                      <button
                        onClick={() => { setGameData({ list: lesson4Scenarios, lessonTitle: 'Bài 4: Một Số Công Nghệ Mới', modeTitle: 'Lựa Chọn Công Nghệ Phù Hợp' }); setScreen('scenario'); }}
                        className="w-full p-2.5 text-left rounded-xl bg-slate-50 hover:bg-sky-50 border border-slate-200 hover:border-sky-300 text-xs font-bold text-slate-800"
                      >
                        🎯 3. Lựa Chọn Công Nghệ Tình Huống
                      </button>
                    </div>
                  </div>

                  {/* Bài 6 */}
                  <div className="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm space-y-4">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-amber-800 bg-amber-50 px-2.5 py-0.5 rounded-full border border-amber-200">Bài 6 (SGK tr. 33)</span>
                    </div>
                    <h3 className="text-lg font-bold text-slate-900 font-heading">Cách Mạng Công Nghiệp</h3>
                    <p className="text-xs text-slate-500">4 cuộc CMCN: Lần 1 (Hơi nước), Lần 2 (Điện), Lần 3 (CNTT, PLC), Lần 4 (Số hoá, AI, IoT, Smart Factory).</p>
                    <div className="space-y-2">
                      <button
                        onClick={() => { setGameData({ pairs: lesson6AchievementPairs, lessonTitle: 'Bài 6: Cách Mạng Công Nghiệp', modeTitle: 'Ghép Thành Tựu – Cuộc Cách Mạng' }); setScreen('match'); }}
                        className="w-full p-2.5 text-left rounded-xl bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-300 text-xs font-bold text-slate-800"
                      >
                        🏆 1. Ghép Thành Tựu – Cuộc CMCN
                      </button>
                      <button
                        onClick={() => { setGameData({ pairs: lesson6Timeline.map((t, i) => ({ id: String(i), left: `${t.title} (${t.author})`, right: `Năm ${t.year} (${t.rev})`, exp: `${t.title} năm ${t.year}` })), lessonTitle: 'Bài 6: Cách Mạng Công Nghiệp', modeTitle: 'Dòng Thời Gian Các Phát Minh' }); setScreen('match'); }}
                        className="w-full p-2.5 text-left rounded-xl bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-300 text-xs font-bold text-slate-800"
                      >
                        ⏳ 2. Sắp Xếp Dòng Thời Gian
                      </button>
                      <button
                        onClick={() => { setGameData({ list: lesson6RoleFeatureScenarios, lessonTitle: 'Bài 6: Cách Mạng Công Nghiệp', modeTitle: 'Phân Biệt Đặc Trưng Và Vai Trò' }); setScreen('scenario'); }}
                        className="w-full p-2.5 text-left rounded-xl bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-300 text-xs font-bold text-slate-800"
                      >
                        ⚖️ 3. Phân Biệt Đặc Trưng Và Vai Trò
                      </button>
                    </div>
                  </div>
                </div>

                {/* Integration Info Bar */}
                <div className="p-3.5 bg-white rounded-2xl border border-slate-200 text-xs text-slate-600 flex flex-col sm:flex-row justify-between items-center gap-2">
                  <span>Hệ thống tự động gửi dữ liệu điểm thi về Google Sheets giáo viên tại:</span>
                  <span className="font-mono text-[11px] text-indigo-700 font-bold bg-slate-100 px-2 py-0.5 rounded">
                    .../s/AKfycbzfNxnrblyIzK2eFu26G6MNV-M6iwM2En-WQGchCJZUL0vfZkCIJITYpHwBfRS3hiA0DQ/exec
                  </span>
                </div>
              </div>
            )}

            {screen === 'match' && gameData && (
              <MatchingView pairs={gameData.pairs} lessonTitle={gameData.lessonTitle} modeTitle={gameData.modeTitle} />
            )}

            {screen === 'scenario' && gameData && (
              <ScenarioView list={gameData.list} lessonTitle={gameData.lessonTitle} modeTitle={gameData.modeTitle} />
            )}

            {screen === 'result' && <ResultView />}
          </main>

          {/* Student Profile Dialog */}
          {showProfileModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full border border-slate-200 shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-900">Thông Tin Học Sinh</h3>
                <p className="text-xs text-slate-600">Nhập mã học sinh, họ tên và chọn lớp để kết quả được lưu và báo cáo lên Google Sheets giáo viên.</p>
                <div>
                  <label className="text-xs font-bold text-slate-700 block mb-1">Mã học sinh (VD: 10C05-01):</label>
                  <input
                    id="inp_id"
                    type="text"
                    defaultValue={studentId}
                    placeholder="Ví dụ: 10C05-01 hoặc 10C06-15"
                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-mono font-bold outline-none focus:border-indigo-600"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-700 block mb-1">Họ và tên:</label>
                  <input
                    id="inp_name"
                    type="text"
                    defaultValue={studentName}
                    placeholder="Ví dụ: Nguyễn Văn An"
                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm outline-none focus:border-indigo-600"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-700 block mb-1">Lớp học (10C05 hoặc 10C06):</label>
                  <select id="inp_class" defaultValue={studentClass || '10C05'} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-bold outline-none">
                    <option value="10C05">Lớp 10C05</option>
                    <option value="10C06">Lớp 10C06</option>
                  </select>
                </div>
                <button
                  onClick={() => {
                    const id = document.getElementById('inp_id').value.trim();
                    const n = document.getElementById('inp_name').value.trim();
                    const c = document.getElementById('inp_class').value;
                    if (n) saveStudent(id, n, c);
                  }}
                  className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow-md"
                >
                  Lưu & Bắt Đầu Chơi
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-200 bg-white/90 py-3 text-center text-xs text-slate-500">
            Công Nghệ 10 - Kết Nối Tri Thức Với Cuộc Sống • Bản Tự Chạy Độc Lập
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
